<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartKiddo Universe - Math Playground</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <style>
        :root {
            --space-bg: linear-gradient(135deg, #0b001a 0%, #1a0b36 50%, #030008 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --neon-pink: #ff2a85;
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --neon-yellow: #ffdf00;
            --neon-green: #39ff14;
            --text-light: #ffffff;
            --text-muted: #b5a8cb;
            --accent-gradient: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .brand, .btn {
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background: var(--space-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        /* Top Header Nav */
        header {
            background: rgba(11, 0, 26, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand {
            font-size: 26px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            letter-spacing: 0.5px;
        }

        .gamification-status {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-capsule {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
        }

        .avatar {
            font-size: 22px;
            background: rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--neon-blue);
        }

        .xp-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .xp-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .xp-bar-bg {
            width: 100px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            box-shadow: 0 0 10px var(--neon-blue);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-dropdown {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border);
            color: white;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        .lang-dropdown:hover {
            border-color: var(--neon-blue);
        }

        .lang-dropdown option {
            background-color: #1a0b36;
            color: white;
        }

        .reset-link {
            color: #ff5e97;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 94, 151, 0.2);
            padding: 5px 12px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .reset-link:hover {
            background: rgba(255, 94, 151, 0.1);
            border-color: #ff5e97;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 45px 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: cardEnter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            font-size: 32px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--neon-blue);
            text-transform: uppercase;
            font-size: 13px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.7;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 20px 14px 48px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            padding: 16px 28px;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 42, 133, 0.5);
        }

        .cosmic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            .cosmic-grid { grid-template-columns: 1fr; }
        }

        .btn-year {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--glass-border);
            color: white;
            padding: 22px 15px;
            border-radius: 20px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-year .icon { font-size: 32px; transition: transform 0.3s; }
        .btn-year:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-5px);
        }
        .btn-year:hover .icon { transform: scale(1.2); }

        .btn-topic {
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed var(--glass-border);
            color: white;
            padding: 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            transition: all 0.3s;
            width: 100%;
            cursor: pointer;
        }

        .btn-topic .topic-icon-frame {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: transform 0.3s;
        }

        .theme-tambah { border-color: #ff2a85; }
        .theme-tambah .topic-icon-frame { background: rgba(255, 42, 133, 0.15); color: #ff2a85; }
        .theme-tambah:hover { background: rgba(255, 42, 133, 0.1); border-color: #ff2a85; box-shadow: 0 0 15px rgba(255, 42, 133, 0.3); }

        .theme-tolak { border-color: #00f0ff; }
        .theme-tolak .topic-icon-frame { background: rgba(0, 240, 255, 0.15); color: #00f0ff; }
        .theme-tolak:hover { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .theme-darab { border-color: #bd00ff; }
        .theme-darab .topic-icon-frame { background: rgba(189, 0, 255, 0.15); color: #bd00ff; }
        .theme-darab:hover { background: rgba(189, 0, 255, 0.1); border-color: #bd00ff; box-shadow: 0 0 15px rgba(189, 0, 255, 0.3); }

        .theme-bahagi { border-color: #39ff14; }
        .theme-bahagi .topic-icon-frame { background: rgba(57, 255, 20, 0.15); color: #39ff14; }
        .theme-bahagi:hover { background: rgba(57, 255, 20, 0.1); border-color: #39ff14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }

        .theme-sifir { border-color: #ffdf00; }
        .theme-sifir .topic-icon-frame { background: rgba(255, 223, 0, 0.15); color: #ffdf00; }
        .theme-sifir:hover { background: rgba(255, 223, 0, 0.1); border-color: #ffdf00; box-shadow: 0 0 15px rgba(255, 223, 0, 0.3); }

        .btn-navigation {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 12px 25px; border-radius: 15px;
            font-size: 14px; font-weight: bold; margin-top: 30px;
            width: auto; display: inline-flex; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.3s;
        }

        .btn-navigation:hover {
            color: white; border-color: white; background: rgba(255,255,255,0.05);
        }

        footer {
            padding: 20px; text-align: center; font-size: 13px; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.03); z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <span class="brand">SmartKiddo Universe</span>
        </div>
        
        <div class="gamification-status">
            <div class="profile-capsule" id="profile-capsule" style="display: none;">
                <div class="avatar" id="avatar-emoji">🚀</div>
                <div class="xp-container">
                    <span id="header-user" class="xp-label">Hi, Kiddo!</span>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill" id="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <select id="lang-select" class="lang-dropdown" onchange="App.changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="my">Bahasa Melayu</option>
                <option value="zh">中文</option>
            </select>

            <a id="reset-profile-btn" class="reset-link" onclick="App.resetProfile()" style="display: none;">Reset</a>
        </div>
    </header>

    <main>
        <div class="glass-card">
            
            <!-- Onboarding View -->
            <div id="onboarding-view" class="view">
                <h2 id="onboard-title">Enter the Orbit!</h2>
                <p id="onboard-subtitle" class="subtitle">Prepare for your math journey across the cosmos.</p>
                <div class="form-group">
                    <label id="label-name" for="username">Your Space Name</label>
                    <div class="input-wrapper">
                        <span class="icon">🧑‍🚀</span>
                        <input type="text" id="username" autocomplete="off" placeholder="E.g., Captain Star">
                    </div>
                </div>
                <div class="form-group">
                    <label id="label-age" for="userage">Your Age</label>
                    <div class="input-wrapper">
                        <span class="icon">🎂</span>
                        <input type="number" id="userage" min="4" max="18" placeholder="E.g., 8">
                    </div>
                </div>
                <button class="btn" id="btn-start" onclick="App.saveProfile()">Launch Game</button>
            </div>

            <!-- Year Selection View -->
            <div id="year-view" class="view">
                <h2 id="year-title">Select Your Level</h2>
                <p id="year-subtitle" class="subtitle">Choose a star system suitable for your level.</p>
                <div class="cosmic-grid">
                    <button class="btn-year" onclick="App.selectYear(1)"><span class="icon">🪐</span><span class="year-prefix">Year</span> 1</button>
                    <button class="btn-year" onclick="App.selectYear(2)"><span class="icon">🌍</span><span class="year-prefix">Year</span> 2</button>
                    <button class="btn-year" onclick="App.selectYear(3)"><span class="icon">☄️</span><span class="year-prefix">Year</span> 3</button>
                    <button class="btn-year" onclick="App.selectYear(4)"><span class="icon">🌕</span><span class="year-prefix">Year</span> 4</button>
                    <button class="btn-year" onclick="App.selectYear(5)"><span class="icon">⭐️</span><span class="year-prefix">Year</span> 5</button>
                    <button class="btn-year" onclick="App.selectYear(6)"><span class="icon">🌌</span><span class="year-prefix">Year</span> 6</button>
                </div>
            </div>

            <!-- Topic Selection View -->
            <div id="topic-view" class="view">
                <h2 id="topic-title">Choose Your Mission</h2>
                <p id="topic-subtitle" class="subtitle">Ready to unlock incredible challenges?</p>
                <div class="cosmic-grid">
                    <button class="btn-topic theme-tambah" onclick="App.startMath('tambah')">
                        <div class="topic-icon-frame">➕</div>
                        <span id="btn-tambah">Tambah</span>
                    </button>
                    <button class="btn-topic theme-tolak" onclick="App.startMath('tolak')">
                        <div class="topic-icon-frame">➖</div>
                        <span id="btn-tolak">Tolak</span>
                    </button>
                    <button class="btn-topic theme-darab" onclick="App.startMath('darab')">
                        <div class="topic-icon-frame">✖️</div>
                        <span id="btn-darab">Darab</span>
                    </button>
                    <button class="btn-topic theme-bahagi" onclick="App.startMath('bahagi')">
                        <div class="topic-icon-frame">➗</div>
                        <span id="btn-bahagi">Bahagi</span>
                    </button>
                    <button class="btn-topic theme-sifir" onclick="App.startMath('sifir')">
                        <div class="topic-icon-frame">🔢</div>
                        <span id="btn-sifir">Sifir</span>
                    </button>
                </div>
                <button class="btn btn-navigation" id="btn-back" onclick="App.goBackToYears()">
                    <span>⬅️</span> <span id="back-txt">Go Back</span>
                </button>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 SmartKiddo Universe. Designed for cosmic learners.
    </footer>

    <script>
        const translations = {
            en: {
                onboardTitle: "Enter the Orbit!",
                onboardSubtitle: "Prepare for your math journey across the cosmos.",
                labelName: "Your Space Name",
                placeholderName: "E.g., Captain Astro",
                labelAge: "Your Age",
                placeholderAge: "E.g., 8",
                btnStart: "Launch Game",
                greeting: "Hi, {name}!",
                yearTitle: "Select Your Level",
                yearSubtitle: "Choose a star system suitable for your level.",
                yearPrefix: "Year",
                topicTitle: "Choose Your Mission",
                topicSubtitle: "Level {year} • Ready to start your module?",
                tambah: "Addition (Tambah)",
                tolak: "Subtraction (Tolak)",
                darab: "Multiplication (Darab)",
                bahagi: "Division (Bahagi)",
                sifir: "Times Tables (Sifir)",
                btnBack: "Go Back",
                btnReset: "Reset",
                nameAlert: "Please enter your name!",
                ageAlert: "Please enter a valid age!"
            },
            my: {
                onboardTitle: "Masuk ke Orbit!",
                onboardSubtitle: "Sediakan diri untuk pengembaraan matematik di angkasa.",
                labelName: "Nama Angkasa Anda",
                placeholderName: "Cth: Kapten Bintang",
                labelAge: "Umur Anda",
                placeholderAge: "Cth: 8",
                btnStart: "Lancar Game",
                greeting: "Hai, {name}!",
                yearTitle: "Pilih Tahap Anda",
                yearSubtitle: "Pilih sistem bintang yang sesuai untuk tahap anda.",
                yearPrefix: "Tahun",
                topicTitle: "Pilih Misi Anda",
                topicSubtitle: "Tahun {year} • Sedia untuk memulakan modul anda?",
                tambah: "Tambah",
                tolak: "Tolak",
                darab: "Darab",
                bahagi: "Bahagi",
                sifir: "Sifir",
                btnBack: "Kembali",
                btnReset: "Set Semula",
                nameAlert: "Sila masukkan nama anda!",
                ageAlert: "Sila masukkan umur yang sah!"
            },
            zh: {
                onboardTitle: "进入太空轨道！",
                onboardSubtitle: "为你的跨宇宙数学之旅做好准备。",
                labelName: "您的太空代号",
                placeholderName: "例如：星际船长",
                labelAge: "您的年龄",
                placeholderAge: "例如：8",
                btnStart: "启动游戏",
                greeting: "你好，{name}！",
                yearTitle: "选择你的等级",
                yearSubtitle: "选择适合你水平的星系。",
                yearPrefix: "年级",
                topicTitle: "选择您的任务",
                topicSubtitle: "年级 {year} • 准备好开始学习了吗？",
                tambah: "加法 (Tambah)",
                tolak: "减法 (Tolak)",
                darab: "乘法 (Darab)",
                bahagi: "除法 (Bahagi)",
                sifir: "乘法表 (Sifir)",
                btnBack: "返回",
                btnReset: "重置",
                nameAlert: "请输入您的名字！",
                ageAlert: "请输入正确的年龄！"
            }
        };

        const App = {
            lang: 'en',
            selectedYear: null,
            userProfile: { name: '', age: 8, xp: 0 },

            init() {
                const storedLang = localStorage.getItem('smartkiddo_lang');
                if (storedLang) {
                    this.lang = storedLang;
                    document.getElementById('lang-select').value = this.lang;
                }
                this.loadProfile();
            },

            loadProfile() {
                const name = localStorage.getItem('smartkiddo_name');
                const age = localStorage.getItem('smartkiddo_age');
                const xp = parseInt(localStorage.getItem('smartkiddo_xp')) || 25;

                if (name && age) {
                    this.userProfile = { name, age, xp };
                    document.getElementById('reset-profile-btn').style.display = 'inline-block';
                    document.getElementById('profile-capsule').style.display = 'flex';
                    this.updateGamificationUI();
                    this.showView('year-view');
                } else {
                    document.getElementById('reset-profile-btn').style.display = 'none';
                    document.getElementById('profile-capsule').style.display = 'none';
                    this.showView('onboarding-view');
                }
                this.applyLanguage();
            },

            saveProfile() {
                const nameInput = document.getElementById('username').value.trim();
                const ageInput = parseInt(document.getElementById('userage').value);

                if (!nameInput) {
                    alert(translations[this.lang].nameAlert);
                    return;
                }
                if (!ageInput || ageInput < 3 || ageInput > 18) {
                    alert(translations[this.lang].ageAlert);
                    return;
                }

                localStorage.setItem('smartkiddo_name', nameInput);
                localStorage.setItem('smartkiddo_age', ageInput);
                localStorage.setItem('smartkiddo_xp', 35);
                this.loadProfile();
            },

            resetProfile() {
                const confirmMsg = this.lang === 'zh' ? '确定要重置您的太空档案吗？' : this.lang === 'my' ? 'Adakah anda mahu memadam profil angkasa anda?' : 'Are you sure you want to reset your space profile?';
                if (confirm(confirmMsg)) {
                    localStorage.removeItem('smartkiddo_name');
                    localStorage.removeItem('smartkiddo_age');
                    localStorage.removeItem('smartkiddo_xp');
                    document.getElementById('username').value = "";
                    document.getElementById('userage').value = "";
                    this.selectedYear = null;
                    this.loadProfile();
                }
            },

            updateGamificationUI() {
                const temp = translations[this.lang].greeting;
                document.getElementById('header-user').textContent = temp.replace('{name}', this.userProfile.name);
                const emoji = this.userProfile.age >= 10 ? '👾' : '🚀';
                document.getElementById('avatar-emoji').textContent = emoji;
                const barFill = document.getElementById('xp-bar-fill');
                setTimeout(() => {
                    barFill.style.width = `${Math.min(this.userProfile.xp, 100)}%`;
                }, 200);
            },

            showView(viewId) {
                const views = document.querySelectorAll('.view');
                views.forEach(v => v.classList.remove('active'));
                const target = document.getElementById(viewId);
                if (target) target.classList.add('active');
            },

            selectYear(year) {
                this.selectedYear = year;
                this.showView('topic-view');
                this.applyLanguage();
            },

            goBackToYears() {
                this.selectedYear = null;
                this.showView('year-view');
            },

            startMath(topic) {
                // REDIRECT TO SEPARATE FILE IF YEAR 1 TAMBAH IS SELECTED!
                if (this.selectedYear === 1 && topic === 'tambah') {
                    window.location.href = 'tambah-tahun1.html';
                } else {
                    alert(`Mission Configured!\nLoading Interactive Game: ${topic.toUpperCase()} (Year ${this.selectedYear})`);
                }
            },

            changeLanguage(lang) {
                this.lang = lang;
                localStorage.setItem('smartkiddo_lang', lang);
                this.loadProfile();
            },

            applyLanguage() {
                const dict = translations[this.lang];
                document.getElementById('onboard-title').textContent = dict.onboardTitle;
                document.getElementById('onboard-subtitle').textContent = dict.onboardSubtitle;
                document.getElementById('label-name').textContent = dict.labelName;
                document.getElementById('username').placeholder = dict.placeholderName;
                document.getElementById('label-age').textContent = dict.labelAge;
                document.getElementById('userage').placeholder = dict.placeholderAge;
                document.getElementById('btn-start').textContent = dict.btnStart;

                document.getElementById('year-title').textContent = dict.yearTitle;
                document.getElementById('year-subtitle').textContent = dict.yearSubtitle;
                document.querySelectorAll('.year-prefix').forEach(elem => {
                    elem.textContent = dict.yearPrefix;
                });

                if (this.selectedYear) {
                    document.getElementById('topic-title').textContent = dict.topicTitle;
                    document.getElementById('topic-subtitle').textContent = dict.topicSubtitle.replace('{year}', this.selectedYear);
                }
                document.getElementById('btn-tambah').textContent = dict.tambah;
                document.getElementById('btn-tolak').textContent = dict.tolak;
                document.getElementById('btn-darab').textContent = dict.darab;
                document.getElementById('btn-bahagi').textContent = dict.bahagi;
                document.getElementById('btn-sifir').textContent = dict.sifir;
                document.getElementById('btn-back').textContent = dict.btnBack;
                document.getElementById('reset-profile-btn').textContent = dict.btnReset;
            }
        };

        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
